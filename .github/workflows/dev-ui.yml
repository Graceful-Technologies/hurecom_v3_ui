name: Hurecom UI DEV CI

on:
  push:
    branches:
      - development

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Use project npm version
        run: npm install -g npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build

      - name: Create UI deployment ZIP
        run: |
          cd dist/hurecom-ui/browser
          zip -r ../../../hurecom-ui-dev.zip .

      - name: Show deployment ZIP
        run: ls -lh hurecom-ui-dev.zip

      - name: Copy UI deployment ZIP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}
          source: "hurecom-ui-dev.zip"
          target: "C:/Apps/hurecom-ui-dev"

      - name: Copy deployment script
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}
          source: "scripts/deploy-ui.ps1"
          target: "C:/Apps/hurecom-ui-dev"

      - name: Deploy UI to Nginx DEV
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}
          script: |
            powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Apps\hurecom-ui-dev\deploy-ui.ps1"

      - name: Verify DEV UI
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}
          script: |
            powershell.exe -NoProfile -NonInteractive -Command "if (Test-Path 'C:\nginx-1.29.8\html\hurecom-dev\index.html') { Write-Host 'DEV UI index.html found' } else { Write-Error 'DEV UI index.html NOT found'; exit 1 }"