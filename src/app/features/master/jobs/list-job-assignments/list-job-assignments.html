<div class="hr-card">
    <div class="flex items-center justify-between mb-3">
        <div class="text-[16px] font-[600]">
            Assignments
        </div>
        <p-button label="Assign Team" size="small" (onClick)="openAssignTeamDialog()"></p-button>
    </div>

    <p-table [value]="assignments()" [scrollable]="true">
        <ng-template #header>
            <tr>
                <th scope="col">Team</th>
                <th scope="col">Effective From</th>
                <th scope="col">Actions</th>
            </tr>
        </ng-template>
        <ng-template #body let-assignment>
            <tr>
                <td>
                    {{assignment.teamName}}
                </td>
                <td>
                    {{assignment.startDate | date:'mediumDate'}}
                </td>
                <td>
                    <p-button label="Remove" icon="pi pi-trash" variant="outlined" size="small"
                        (onClick)="removeAssignment(assignment)">
                    </p-button>
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td colspan="3">
                    <div class="hr-small-empty">
                        <p class="hr-small-empty-title">No assignments found</p>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
