<div class="hr-card">
    <div class="flex items-center justify-between mb-3">
        <div class="text-[16px] font-[600]">Assignments</div>
        <button mat-stroked-button color="primary" (click)="openAssignTeamDialog()">Assign Team</button>
    </div>

    <table mat-table [dataSource]="assignments()" class="w-full">
        <ng-container matColumnDef="team">
            <th mat-header-cell *matHeaderCellDef>Team</th>
            <td mat-cell *matCellDef="let assignment">{{ assignment.teamName }}</td>
        </ng-container>

        <ng-container matColumnDef="effectiveFrom">
            <th mat-header-cell *matHeaderCellDef>Effective From</th>
            <td mat-cell *matCellDef="let assignment">{{ assignment.startDate | date:'mediumDate' }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let assignment">
                <button mat-stroked-button color="warn" (click)="removeAssignment(assignment)">Remove</button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['team', 'effectiveFrom', 'actions']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['team', 'effectiveFrom', 'actions'];"></tr>
    </table>

    @if (assignments().length === 0) {
    <div class="hr-small-empty">
        <p class="hr-small-empty-title">No assignments found</p>
    </div>
    }
</div>
