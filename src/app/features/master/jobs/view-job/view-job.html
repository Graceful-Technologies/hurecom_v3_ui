@if(job()){
<div class="hr-page">
    <div class="hr-page-header">
        <div class="hr-page-title">Job Details</div>
    </div>

    <mat-tab-group>
        <mat-tab label="Job Details">
            <app-view-job-details [job]="job()" (jobUpdated)="getJob()" />
        </mat-tab>
        <mat-tab label="Attachments">
            <app-list-job-attachments [job]="job()" />
        </mat-tab>
        <mat-tab label="Assignments">
            <app-list-job-assignments [job]="job()" />
        </mat-tab>
        <mat-tab label="Commission Details">
            <app-list-job-commissions [job]="job()" />
        </mat-tab>
    </mat-tab-group>
</div>
}
