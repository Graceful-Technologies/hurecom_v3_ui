<div class="hr-card">
    <div class="flex items-center justify-between mb-3">
        <div class="text-[16px] font-[600]">
            Attachments
        </div>
        <p-button label="Upload" size="small" (onClick)="openUploadAttachmentDialog()"></p-button>
    </div>
    <p-table [value]="attachments()" [scrollable]="true">
        <ng-template #header>
            <tr>
                <th scope="col">File</th>
                <th scope="col">Actions</th>
            </tr>
        </ng-template>
        <ng-template #body let-attachment>
            <tr>
                <td>
                    {{attachment.fileName}}
                </td>
                <td>
                    <div class="flex gap-2">
                        <p-button label="Download" icon="pi pi-download" variant="outlined" size="small"
                            (onClick)="downloadAttachment(attachment)">
                        </p-button>
                        <p-button label="Remove" icon="pi pi-trash" variant="outlined" size="small"
                            (onClick)="removeAttachment(attachment)">
                        </p-button>
                    </div>
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td colspan="2">
                    <div class="hr-small-empty">
                        <p class="hr-small-empty-title">No attachments found</p>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
