<div class="hr-card">
    <div class="flex items-center justify-between mb-3">
        <div class="text-[16px] font-[600]">Attachments</div>
        <button mat-stroked-button color="primary" (click)="openUploadAttachmentDialog()">Upload</button>
    </div>

    <table mat-table [dataSource]="attachments()" class="w-full">
        <ng-container matColumnDef="file">
            <th mat-header-cell *matHeaderCellDef>File</th>
            <td mat-cell *matCellDef="let attachment">{{ attachment.fileName }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let attachment">
                <div class="flex gap-2">
                    <button mat-stroked-button (click)="downloadAttachment(attachment)">Download</button>
                    <button mat-stroked-button color="warn" (click)="removeAttachment(attachment)">Remove</button>
                </div>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['file', 'actions']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['file', 'actions'];"></tr>
    </table>

    @if (attachments().length === 0) {
    <div class="hr-small-empty">
        <p class="hr-small-empty-title">No attachments found</p>
    </div>
    }
</div>
