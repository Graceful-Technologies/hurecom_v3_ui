<table mat-table [dataSource]="availableTeams()" class="w-full">
    <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let team">
            <mat-checkbox (change)="$event ? toggleTeam(team) : null" [checked]="isSelected(team)"></mat-checkbox>
        </td>
    </ng-container>

    <ng-container matColumnDef="team">
        <th mat-header-cell *matHeaderCellDef>Team</th>
        <td mat-cell *matCellDef="let team">
            <div class="hr-cell-primary">{{ team.name }}</div>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['select', 'team']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['select', 'team'];"></tr>
</table>

<div class="hurecom-dialog-footer flex justify-end gap-2 pt-2">
    <button mat-flat-button color="primary" (click)="assign()" [disabled]="!selectedTeams || selectedTeams.length === 0">
        Assign
    </button>
</div>
