<p-table [value]="availableTeams()" [(selection)]="selectedTeams" dataKey="id">
    <ng-template pTemplate="header">
        <tr>
            <th style="width: 4rem">
                <p-tableHeaderCheckbox />
            </th>
            <th>Team</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-team>
        <tr>
            <td>
                <p-tableCheckbox [value]="team" />
            </td>
            <td>
                <div class="hr-cell-primary">{{ team.name }}</div>
            </td>
        </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="3">
                <div class="hr-empty">
                    <i class="pi pi-users"></i>
                    <p class="hr-empty-title">No teams found</p>
                </div>
            </td>
        </tr>
    </ng-template>
</p-table>
<div class="hurecom-dialog-footer flex justify-end gap-2 pt-2">
    <p-button label="Assign" (click)="assign()"
        [disabled]="!selectedTeams || selectedTeams.length === 0"></p-button>
</div>
