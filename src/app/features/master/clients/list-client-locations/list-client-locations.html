<div class="hr-card">
    <div class="hr-table-header">
        <div>
            <h2 class="hr-table-title">Client Locations</h2>
        </div>
        <button mat-flat-button color="primary" (click)="openAddClientLocationDialog()">
            <mat-icon>add</mat-icon>
            Add Location
        </button>
    </div>

    <table mat-table [dataSource]="clientLocations()" class="w-full">
        <ng-container matColumnDef="branchName">
            <th mat-header-cell *matHeaderCellDef>Branch Name</th>
            <td mat-cell *matCellDef="let location">{{ location.branchName }}</td>
        </ng-container>
        <ng-container matColumnDef="cityName">
            <th mat-header-cell *matHeaderCellDef>City</th>
            <td mat-cell *matCellDef="let location">{{ location.cityName }}</td>
        </ng-container>
        <ng-container matColumnDef="stateName">
            <th mat-header-cell *matHeaderCellDef>State</th>
            <td mat-cell *matCellDef="let location">{{ location.stateName }}</td>
        </ng-container>
        <ng-container matColumnDef="countryName">
            <th mat-header-cell *matHeaderCellDef>Country</th>
            <td mat-cell *matCellDef="let location">{{ location.countryName }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let location">
                <span class="hr-badge" [ngClass]="location.active ? 'status-active' : 'status-inactive'">
                    {{ location.active ? 'Active' : 'Inactive' }}
                </span>
            </td>
        </ng-container>
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let location">
                <button mat-stroked-button (click)="openEditClientLocationDialog(location)">Edit</button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['branchName', 'cityName', 'stateName', 'countryName', 'status', 'actions']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['branchName', 'cityName', 'stateName', 'countryName', 'status', 'actions'];"></tr>
    </table>

    @if (clientLocations().length === 0) {
    <div class="hr-empty">
        <p class="hr-empty-title">No locations found</p>
    </div>
    }
</div>
