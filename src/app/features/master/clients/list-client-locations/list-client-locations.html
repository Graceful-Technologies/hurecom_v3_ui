<div class="hr-card">
    <div class="hr-table-header">
        <div>
            <h2 class="hr-table-title">Client Locations</h2>
        </div>
        <p-button label="Add Location" icon="pi pi-plus" (onClick)="openAddClientLocationDialog()"></p-button>
    </div>
    <p-table [value]="clientLocations()">
        <ng-template pTemplate="header">
            <tr>
                <th>Branch Name</th>
                <th>City</th>
                <th>State</th>
                <th>Country</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-location>
            <tr>
                <td>
                    <div class="hr-cell-primary">{{ location.branchName }}</div>
                </td>
                <td>
                    <div class="hr-cell-primary">
                        {{ location.cityName }}
                    </div>
                </td>
                <td>
                    <div class="hr-cell-primary">
                        {{ location.stateName }}
                    </div>
                </td>
                <td>
                    <div class="hr-cell-primary">
                        {{ location.countryName }}
                    </div>
                </td>
                <td>
                    <span class="hr-badge" [ngClass]="location.active ? 'status-active' : 'status-inactive'">
                        {{ location.active ? 'Active' : 'Inactive' }}
                    </span>
                </td>
                <td>
                    <p-button label="Edit" variant="outlined" (onClick)="openEditClientLocationDialog(location)"
                        size="small">
                    </p-button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6">
                    <div class="hr-empty">
                        <p class="hr-empty-title">No locations found</p>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
