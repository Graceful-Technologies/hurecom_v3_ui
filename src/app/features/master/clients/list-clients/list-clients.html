<div class="hr-card">
    <div class="hr-page-header">
        <div>
            <h2 class="hr-page-title">Clients</h2>
            <p class="hr-page-sub">Manage clients and their information</p>
        </div>
        <p-button label="Add Client" icon="pi pi-plus" (onClick)="openAddClientDialog()" />
    </div>
    <p-table [value]="clients()">
        <ng-template pTemplate="header">
            <tr>
                <th>Client</th>
                <th>Created On</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-client>
            <tr>
                <td>
                    <div class="hr-cell-primary">{{ client.name }}</div>
                </td>
                <td>
                    <div class="hr-cell-primary">
                        {{ client.createdDate | date:'mediumDate' }}
                    </div>
                </td>
                <td>
                    <span class="hr-badge" [ngClass]="client.active ? 'status-active' : 'status-inactive'">
                        {{ client.active ? 'Active' : 'Inactive' }}
                    </span>
                </td>
                <td>
                    <p-button label="View" variant="outlined" [routerLink]="['view', client.id]" size="small">
                    </p-button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5">
                    <div class="hr-empty">
                        <i class="pi pi-users"></i>
                        <p class="hr-empty-title">No clients found</p>
                        <p class="hr-empty-sub">Try adjusting your search or filter</p>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
    <app-paginator [totalRecords]="totalRecords()" [rows]="rowsPerPage()" [page]="currentPage()"
        (pageChange)="onPageChange($event)">
    </app-paginator>
</div>
