<div class="hr-card">
    <div class="hr-page-header">
        <div>
            <h2 class="hr-page-title">Clients</h2>
            <p class="hr-page-sub">Manage clients and their information</p>
        </div>
        <button mat-flat-button color="primary" (click)="openAddClientDialog()">
            <mat-icon>add</mat-icon>
            Add Client
        </button>
    </div>

    <table mat-table [dataSource]="clients()" class="w-full">
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Client</th>
            <td mat-cell *matCellDef="let client">{{ client.name }}</td>
        </ng-container>

        <ng-container matColumnDef="createdDate">
            <th mat-header-cell *matHeaderCellDef>Created On</th>
            <td mat-cell *matCellDef="let client">{{ client.createdDate | date:'mediumDate' }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let client">
                <span class="hr-badge" [ngClass]="client.active ? 'status-active' : 'status-inactive'">
                    {{ client.active ? 'Active' : 'Inactive' }}
                </span>
            </td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let client">
                <button mat-stroked-button [routerLink]="['view', client.id]">View</button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['name', 'createdDate', 'status', 'actions']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['name', 'createdDate', 'status', 'actions'];"></tr>
    </table>

    @if (clients().length === 0) {
    <div class="hr-empty">
        <mat-icon>people</mat-icon>
        <p class="hr-empty-title">No clients found</p>
        <p class="hr-empty-sub">Try adjusting your search or filter</p>
    </div>
    }

    <app-paginator [totalRecords]="totalRecords()" [rows]="rowsPerPage()" [page]="currentPage()"
        (pageChange)="onPageChange($event)">
    </app-paginator>
</div>
