<form [formGroup]="clientForm" class="flex flex-col gap-4" autocomplete="off">

    <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" />
        @if (clientForm.controls['name'].invalid && clientForm.controls['name'].dirty) {
        <mat-error>Name is required</mat-error>
        }
    </mat-form-field>

    <div class="flex items-center justify-between p-3 border rounded-lg">
        <div class="flex flex-col">
            <span class="text-sm font-medium">Active</span>
            <span class="text-xs text-gray-500 mt-1">
                Activate or deactivate this client.
            </span>
        </div>
        <mat-checkbox formControlName="active">Active</mat-checkbox>
    </div>

    <div class="hurecom-dialog-footer flex justify-end gap-2">
        <button mat-stroked-button type="button" (click)="closeDialog()">Cancel</button>
        <button mat-flat-button color="primary" type="button" (click)="saveClient()">
            {{ isEditMode() ? 'Update' : 'Create' }}
        </button>
    </div>

</form>
