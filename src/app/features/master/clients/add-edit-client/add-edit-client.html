<form [formGroup]="clientForm" class="flex flex-col gap-4" autocomplete="off">

    <!-- Name -->
    <div class="flex flex-col gap-1">
        <label class="text-sm font-medium">Name</label>
        <input pInputText formControlName="name" />
        @if (clientForm.controls['name'].invalid && clientForm.controls['name'].dirty) {
        <small class="text-red-500">
            Name is required
        </small>
        }
    </div>

    <div class="flex items-center justify-between p-3 border rounded-lg">
        <div class="flex flex-col">
            <span class="text-sm font-medium">Active</span>
            <span class="text-xs text-gray-500 mt-1">
                Activate or deactivate this client.
            </span>
        </div>
        <p-toggleswitch formControlName="active"></p-toggleswitch>
    </div>

    <!-- Actions -->
    <div class="hurecom-dialog-footer flex justify-end gap-2">
        <p-button label="Cancel" variant="outlined" severity="secondary" (onClick)="closeDialog()" />
        <button pButton [label]="isEditMode() ? 'Update' : 'Create'" (click)="saveClient()">
        </button>
    </div>

</form>
