<div class="hr-card">
    <div class="hr-table-header">
        <div>
            <h2 class="hr-table-title">Client Spocs</h2>
        </div>
        <button mat-flat-button color="primary" (click)="openAddClientSpocDialog()">
            <mat-icon>add</mat-icon>
            Add Spoc
        </button>
    </div>

    <table mat-table [dataSource]="clientSpocs()" class="w-full">
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let spoc">{{ spoc.name }}</td>
        </ng-container>
        <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let spoc">{{ spoc.email }}</td>
        </ng-container>
        <ng-container matColumnDef="mobileNumber">
            <th mat-header-cell *matHeaderCellDef>Mobile Number</th>
            <td mat-cell *matCellDef="let spoc">{{ spoc.mobileNumber }}</td>
        </ng-container>
        <ng-container matColumnDef="landlineNumber">
            <th mat-header-cell *matHeaderCellDef>Landline Number</th>
            <td mat-cell *matCellDef="let spoc">{{ spoc.landlineNumber }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let spoc">
                <span class="hr-badge" [ngClass]="spoc.active ? 'status-active' : 'status-inactive'">
                    {{ spoc.active ? 'Active' : 'Inactive' }}
                </span>
            </td>
        </ng-container>
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let spoc">
                <button mat-stroked-button (click)="openEditClientSpocDialog(spoc)">Edit</button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['name', 'email', 'mobileNumber', 'landlineNumber', 'status', 'actions']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['name', 'email', 'mobileNumber', 'landlineNumber', 'status', 'actions'];"></tr>
    </table>

    @if (clientSpocs().length === 0) {
    <div class="hr-empty">
        <p class="hr-empty-title">No spocs found</p>
    </div>
    }
</div>
