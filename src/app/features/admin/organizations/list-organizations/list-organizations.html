<div class="hr-card">
    <div class="hr-page-header">
        <div>
            <h2 class="hr-page-title">Organizations</h2>
            <p class="hr-page-sub">Manage organizations</p>
        </div>
        <p-button label="Add Organization" icon="pi pi-plus" (onClick)="openAddOrganization()" />
    </div>
    <p-table [value]="organizations()" [loading]="loading()">
        <ng-template pTemplate="header">
            <tr>
                <th>Organization</th>
                <th>Created On</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-organization>
            <tr>
                <td>
                    <div>
                        <div class="hr-cell-primary">{{ organization.name }}</div>
                    </div>
                </td>
                <td>
                    <span class="hr-cell-primary">{{ organization.createdDate | date: 'dd MMM yyyy' }}</span>
                </td>
                <td>
                    <span class="hr-badge" [ngClass]="organization.active ? 'status-active' : 'status-inactive'">
                        {{ organization.active ? 'Active' : 'Inactive' }}
                    </span>
                </td>
                <td>
                    <div class="hr-action-buttons">
                        <button class="hr-action-btn" (click)="editOrganization(organization)">
                            <i class="pi pi-pencil"></i>
                        </button>
                    </div>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5">
                    <div class="hr-empty">
                        <i class="pi pi-building"></i>
                        <p class="hr-empty-title">No organizations found</p>
                        <p class="hr-empty-sub">Try adjusting your search or filter</p>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
