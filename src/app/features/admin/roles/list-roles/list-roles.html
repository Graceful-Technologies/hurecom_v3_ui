<div class="hr-card">
    <div class="hr-page-header">
        <div>
            <h2 class="hr-page-title">Roles</h2>
            <p class="hr-page-sub">Manage roles and their permissions</p>
        </div>
    </div>

    <div class="overflow-auto rounded-xl border border-gray-200 bg-white">
        <table mat-table [dataSource]="roles()" class="w-full">
            <ng-container matColumnDef="description">
                <th mat-header-cell *matHeaderCellDef>Role</th>
                <td mat-cell *matCellDef="let role">{{ role.description }}</td>
            </ng-container>

            <ng-container matColumnDef="active">
                <th mat-header-cell *matHeaderCellDef>Status</th>
                <td mat-cell *matCellDef="let role">
                    <span class="hr-badge" [ngClass]="role.active ? 'status-active' : 'status-inactive'">
                        {{ role.active ? 'Active' : 'Inactive' }}
                    </span>
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Actions</th>
                <td mat-cell *matCellDef="let role">
                    <button mat-icon-button type="button" aria-label="Edit role">
                        <mat-icon>edit</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="['description','active','actions']"></tr>
            <tr mat-row *matRowDef="let row; columns: ['description','active','actions'];"></tr>
        </table>

        @if (!roles().length) {
            <div class="hr-empty p-6 text-center">
                <p class="hr-empty-title">No roles found</p>
                <p class="hr-empty-sub">Try adjusting your search or filter</p>
            </div>
        }
    </div>
</div>
