<div class="hr-card">
    <div class="hr-page-header">
        <div>
            <h2 class="hr-page-title">Teams</h2>
            <p class="hr-page-sub">Manage teams and their members</p>
        </div>
        <button mat-flat-button color="primary" type="button" (click)="openAddTeamDialog()">
            <mat-icon>add</mat-icon>
            Add Team
        </button>
    </div>

    <div class="overflow-auto rounded-xl border border-gray-200 bg-white">
        <table mat-table [dataSource]="teams()" class="w-full">
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef>Team</th>
                <td mat-cell *matCellDef="let team">{{ team.name }}</td>
            </ng-container>

            <ng-container matColumnDef="createdDate">
                <th mat-header-cell *matHeaderCellDef>Created On</th>
                <td mat-cell *matCellDef="let team">{{ team.createdDate | date:'mediumDate' }}</td>
            </ng-container>

            <ng-container matColumnDef="active">
                <th mat-header-cell *matHeaderCellDef>Status</th>
                <td mat-cell *matCellDef="let team">
                    <span class="hr-badge" [ngClass]="team.active ? 'status-active' : 'status-inactive'">
                        {{ team.active ? 'Active' : 'Inactive' }}
                    </span>
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Actions</th>
                <td mat-cell *matCellDef="let team">
                    <button mat-stroked-button color="primary" type="button" [routerLink]="['view', team.id]">View</button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="['name','createdDate','active','actions']"></tr>
            <tr mat-row *matRowDef="let row; columns: ['name','createdDate','active','actions'];"></tr>
        </table>

        @if (!teams().length) {
            <div class="hr-empty p-6 text-center">
                <p class="hr-empty-title">No teams found</p>
                <p class="hr-empty-sub">Try adjusting your search or filter</p>
            </div>
        }
    </div>
</div>
