<div class="hr-card">
    <div class="hr-page-header">
        <div>
            <h2 class="hr-page-title">Teams</h2>
            <p class="hr-page-sub">Manage teams and their members</p>
        </div>
        <p-button label="Add Team" icon="pi pi-plus" (onClick)="openAddTeamDialog()" />
    </div>
    <p-table [value]="teams()">
        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="name">Team <p-sortIcon field="name" /></th>
                <th>Created On</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-team>
            <tr>
                <td>
                    <div class="hr-cell-primary">{{ team.name }}</div>
                </td>
                <td>
                    <div class="hr-cell-primary">
                        {{ team.createdDate | date:'mediumDate' }}
                    </div>
                </td>
                <td>
                    <span class="hr-badge" [ngClass]="team.active ? 'status-active' : 'status-inactive'">
                        {{ team.active ? 'Active' : 'Inactive' }}
                    </span>
                </td>
                <td>
                    <p-button label="View" variant="outlined" [routerLink]="['view', team.id]" size="small">
                    </p-button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5">
                    <div class="hr-empty">
                        <i class="pi pi-users"></i>
                        <p class="hr-empty-title">No teams found</p>
                        <p class="hr-empty-sub">Try adjusting your search or filter</p>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
