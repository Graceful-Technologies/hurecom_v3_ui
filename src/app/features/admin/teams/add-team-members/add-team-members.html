<table mat-table [dataSource]="availableUsers()" class="w-full">
    <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let member">
            <mat-checkbox (change)="$event ? toggleMember(member) : null" [checked]="isSelected(member)"></mat-checkbox>
        </td>
    </ng-container>
    <ng-container matColumnDef="member">
        <th mat-header-cell *matHeaderCellDef>Member</th>
        <td mat-cell *matCellDef="let member">{{ member.name }}</td>
    </ng-container>
    <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let member">{{ member.email }}</td>
    </ng-container>
    <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Role</th>
        <td mat-cell *matCellDef="let member">{{ member.roleName }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['select', 'member', 'email', 'role']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['select', 'member', 'email', 'role'];"></tr>
</table>

<div class="flex flex-row justify-end mt-4">
    <button mat-flat-button color="primary" (click)="addTeamMembers()" [disabled]="!selectedMembers || selectedMembers.length === 0">
        Add Members
    </button>
</div>
