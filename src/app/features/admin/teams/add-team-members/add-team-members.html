<p-table [value]="availableUsers()" [(selection)]="selectedMembers" dataKey="id">
    <ng-template pTemplate="header">
        <tr>
            <th style="width: 4rem">
                <p-tableHeaderCheckbox />
            </th>
            <th>Member</th>
            <th>Email</th>
            <th>Role</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-teamMember>
        <tr>
            <td>
                <p-tableCheckbox [value]="teamMember" />
            </td>
            <td>
                <div class="hr-cell-primary">{{ teamMember.name }}</div>
            </td>
            <td>
                <div class="hr-cell-primary">
                    {{ teamMember.email }}
                </div>
            </td>
            <td>
                <div class="hr-cell-primary">
                    {{ teamMember.roleName }}
                </div>
            </td>
        </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="3">
                <div class="hr-empty">
                    <i class="pi pi-users"></i>
                    <p class="hr-empty-title">No members found</p>
                </div>
            </td>
        </tr>
    </ng-template>
</p-table>
<div class="flex flex-row justify-end mt-4">
    <p-button label="Add Members" (click)="addTeamMembers()"
        [disabled]="!selectedMembers || selectedMembers.length === 0"></p-button>
</div>
