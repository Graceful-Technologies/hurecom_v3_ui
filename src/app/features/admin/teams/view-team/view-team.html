<div class="hr-page">
    <div class="hr-page-header">
        <div class="hr-page-title">Team Details</div>
    </div>

    <div class="hr-card">
        <div class="flex flex-row justify-between items-center">
            <div class="flex flex-row gap-4">
                <div class="hr-avatar">
                    {{global.getInitials(team()?.name)}}
                </div>
                <div class="flex flex-row items-center gap-4">
                    <h2 class="hr-page-heading">{{team()?.name}}</h2>
                    <span class="hr-badge" [ngClass]="team()?.active ? 'status-active' : 'status-inactive'">
                        {{ team()?.active ? 'Active' : 'Inactive' }}
                    </span>
                </div>
            </div>
            <p-button label="Edit Team" icon="pi pi-pencil" (onClick)="openEditTeamDialog()"></p-button>
        </div>

        <div class="flex flex-row gap-16 mt-7">
            <div class="flex flex-col gap-1">
                <span class="hr-text-muted text-xs font-medium"> Team Code</span>
                <span> {{ team()?.code }}</span>
            </div>

            <div class="flex flex-col gap-1">
                <span class="hr-text-muted text-xs font-medium">Total Members</span>
                <span>{{ team()?.membersCount || '-'}}</span>
            </div>
            <div class="flex flex-col gap-1">
                <span class="hr-text-muted text-xs font-medium">Created On</span>
                <span>{{ team()?.createdDate | date:'dd MMM yyyy' }}</span>
            </div>


            <div class="flex flex-col gap-1">
                <span class="hr-text-muted text-xs font-medium">Created By</span>
                <span>{{ team()?.createdUserName || '-'}}</span>
            </div>
        </div>
    </div>

    <div class="mt-6">
        <app-list-team-members [team]="team()" (refresh)="getTeam()"></app-list-team-members>
    </div>
</div>
