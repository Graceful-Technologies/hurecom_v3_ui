<div class="hr-card">
    <div class="hr-table-header">
        <div>
            <h2 class="hr-table-title">Team Members</h2>
        </div>
        <button mat-stroked-button color="primary" (click)="openAddMemberDialog()">Add Member</button>
    </div>
    <table mat-table [dataSource]="teamMembers()" class="w-full">
        <ng-container matColumnDef="member">
            <th mat-header-cell *matHeaderCellDef>Member</th>
            <td mat-cell *matCellDef="let teamMember">
                <div class="hr-cell-primary">{{ teamMember.userName }}</div>
            </td>
        </ng-container>

        <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let teamMember">
                <div class="hr-cell-primary">{{ teamMember.email }}</div>
            </td>
        </ng-container>

        <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef>Role</th>
            <td mat-cell *matCellDef="let teamMember">
                <div class="hr-cell-primary">{{ teamMember.roleName }}</div>
            </td>
        </ng-container>

        <ng-container matColumnDef="joinedOn">
            <th mat-header-cell *matHeaderCellDef>Joined On</th>
            <td mat-cell *matCellDef="let teamMember">
                <div class="hr-cell-primary">{{ teamMember.startDate | date:'mediumDate' }}</div>
            </td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let teamMember">
                <button mat-stroked-button color="warn" (click)="removeTeamMember(teamMember)">Remove</button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['member', 'email', 'role', 'joinedOn', 'actions']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['member', 'email', 'role', 'joinedOn', 'actions'];"></tr>
    </table>

    @if (!teamMembers().length) {
    <div class="hr-empty">
        <p class="hr-empty-title">No members found</p>
        <p class="hr-empty-sub">Click <span class="font-medium">Add Member</span> to add members to the team</p>
    </div>
    }
</div>
