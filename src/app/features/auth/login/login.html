<div class="h-screen flex items-center justify-center">

    <div class="w-full max-w-sm bg-white border border-gray-200 rounded-2xl shadow-sm px-6 py-7 flex flex-col gap-6">

        <!-- Header -->
        <div class="text-center">
            <h2 class="text-2xl font-semibold text-gray-800 tracking-tight">
                Welcome Back
            </h2>
            <p class="text-sm text-gray-500 mt-1">
                Sign in to your account
            </p>
        </div>

        <!-- Form -->
        <form [formGroup]="loginForm" (ngSubmit)="login()" class="flex flex-col gap-5" autocomplete="off">

            <!-- Username -->
            <div class="flex flex-col gap-1.5">
                <label class="text-sm font-medium text-gray-700">
                    Username
                </label>

                <input pInputText formControlName="username" placeholder="Enter your username"
                    class="w-full h-10 px-3 rounded-md border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition" />
            </div>

            <!-- Password -->
            <div class="flex flex-col gap-1.5">
                <div class="flex justify-between items-center">
                    <label class="text-sm font-medium text-gray-700">
                        Password
                    </label>

                    <a routerLink="/forgot-password" class="text-xs text-blue-600 hover:underline">
                        Forgot?
                    </a>
                </div>

                <input pInputText type="password" formControlName="password" placeholder="Enter your password"
                    class="w-full h-10 px-3 rounded-md border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition" />
            </div>

            <!-- Button -->
            <button pButton label="Sign In" type="submit" class="w-full h-10 mt-2 font-medium"
                [disabled]="loginForm.invalid"></button>

        </form>

        <!-- Footer -->
        <div class="text-center text-sm text-gray-600">
            Don’t have an account?
            <a routerLink="/register" class="text-blue-600 font-medium hover:underline">
                Create account
            </a>
        </div>

        <!-- Error -->
        @if (errorMessage()) {
        <p class="text-red-500 text-sm text-center">
            {{ errorMessage() }}
        </p>
        }

    </div>

</div>
