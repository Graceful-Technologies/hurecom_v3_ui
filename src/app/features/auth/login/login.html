<div class="h-screen flex items-center justify-center">

  <div class="w-full max-w-sm bg-white border border-gray-200 rounded-2xl shadow-sm px-6 py-7 flex flex-col gap-6">

    <div class="text-center">
      <h2 class="text-2xl font-semibold text-gray-800 tracking-tight">Welcome Back</h2>
      <p class="text-sm text-gray-500 mt-1">Sign in to your account</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()" class="flex flex-col gap-5" autocomplete="off">

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Username</mat-label>
        <input matInput formControlName="username" placeholder="Enter your username" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Password</mat-label>
        <div class="flex items-center justify-between w-full">
          <input matInput type="password" formControlName="password" placeholder="Enter your password" />
        </div>
      </mat-form-field>

      <div class="flex justify-end">
        <a routerLink="/forgot-password" class="text-xs text-blue-600 hover:underline">Forgot?</a>
      </div>

      <button mat-flat-button color="primary" type="submit" class="w-full h-10 mt-2 font-medium" [disabled]="loginForm.invalid">
        Sign In
      </button>
    </form>

    <div class="text-center text-sm text-gray-600">
      Don’t have an account?
      <a routerLink="/register" class="text-blue-600 font-medium hover:underline">Create account</a>
    </div>

    @if (errorMessage()) {
      <p class="text-red-500 text-sm text-center">{{ errorMessage() }}</p>
    }

  </div>

</div>
