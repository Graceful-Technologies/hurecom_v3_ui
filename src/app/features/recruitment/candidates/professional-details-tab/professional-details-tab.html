<div class="">
    <div class="flex items-center justify-between mb-3">
        <div class="text-[15px] font-[600]">
            Professional Information
        </div>
    </div>

    <div class="grid grid-cols-3 gap-4">
        <!-- Name -->
        <div class="flex flex-col gap-1">

            <label class="text-[13px] font-medium text-gray-700">
                Company Name
            </label>

            <input matInput formControlName="currentCompany" class="w-full" />
        </div>

        <!-- Designation -->
        <div class="flex flex-col gap-1">

            <label class="text-[13px] font-medium text-gray-700">
                Designation
            </label>

            <input matInput formControlName="currentDesignation" class="w-full" />
        </div>

        <!-- Qualification -->
        <div class="flex flex-col gap-1">

            <label class="text-[13px] font-medium text-gray-700">
                Qualification
            </label>

            <input matInput formControlName="qualification" class="w-full" />
        </div>
    </div>

    <div class="grid grid-cols-4 gap-4 mt-3">
        <!-- Total Experience -->
        <div class="flex flex-col gap-1">

            <label class="text-[13px] font-medium text-gray-700">
                Total Experience
            </label>
            <input matInput type="number" min="0" max="50" step="0.1" formControlName="totalExperience" class="w-full" />
        </div>

        <!-- Relevant Experience -->
        <div class="flex flex-col gap-1">

            <label class="text-[13px] font-medium text-gray-700">
                Relevant Experience
            </label>
            <input matInput type="number" min="0" max="50" step="0.1" formControlName="relevantExperience" class="w-full" />
        </div>

        <!-- Current Location -->
        <div class="flex flex-col gap-1">

            <label class="text-[13px] font-medium text-gray-700">
                Current Location
            </label>

            <input matInput formControlName="currentLocation" class="w-full" />

        </div>

        <!-- Preferred Location -->
        <div class="flex flex-col gap-1">

            <label class="text-[13px] font-medium text-gray-700">
                Preferred Location
            </label>

            <input matInput formControlName="preferredLocation" class="w-full" />
        </div>
    </div>

    <div class="grid grid-cols-4 gap-4 mt-3">
        <!-- Current CTC -->
        <div class="flex flex-col gap-1">

            <label class="text-[13px] font-medium text-gray-700">
                Current CTC
            </label>
            <input matInput type="number" min="0" step="0.01" formControlName="currentCtc" class="w-full" />
        </div>

        <!-- Expected CTC -->
        <div class="flex flex-col gap-1">

            <label class="text-[13px] font-medium text-gray-700">
                Expected CTC
            </label>
            <input matInput type="number" min="0" step="0.01" formControlName="expectedCtc" class="w-full" />
        </div>
    </div>

    <div class="grid grid-cols-4 gap-4">

        <!-- Work Mode Preference -->
        <div class="flex flex-col gap-1">

            <label class="text-[13px] font-medium text-gray-700">
                Work Mode Preference
            </label>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Work Mode Preference</mat-label>
                <mat-select formControlName="workModePreference">
                    @for (mode of genderList(); track mode.code) {
                    <mat-option [value]="mode.code">{{ mode.name }}</mat-option>
                    }
                </mat-select>
            </mat-form-field>
        </div>


        <!-- Skills -->
        <div class="col-span-2 flex flex-col gap-1">

            <label class="text-[13px] font-medium text-gray-700">
                Skills <span class="text-red-500">*</span>
            </label>

            <input matInput formControlName="skills" placeholder="Enter skills separated by commas" />
            @if (candidateForm().controls['skills'].invalid &&
            candidateForm().controls['skills'].dirty) {

            <small class="text-red-500">
                Skills is required
            </small>
            }
        </div>

        <!-- Notice Period -->
        <div class="flex flex-col gap-1">

            <label class="text-[13px] font-medium text-gray-700">
                Notice Period
            </label>

            <input matInput formControlName="noticePeriod" placeholder="Notice period" />
        </div>

        <!-- Last Working Day -->
        <div class="flex flex-col gap-1">

            <label class="text-[13px] font-medium text-gray-700">
                Last Working Day
            </label>
            <input matInput type="date" formControlName="lastWorkingDay" />
        </div>

        <!-- Remarks -->
        <div class="col-span-2 flex flex-col gap-1">

            <label class="text-[13px] font-medium text-gray-700">
                Recruiter Notes
            </label>
            <textarea matInput rows="3" formControlName="remarks"></textarea>
        </div>
    </div>
</div>
