<form [formGroup]="candidateForm" class="candidate-form">
    <mat-tab-group>
        <mat-tab label="Basic Information">
            <div class="pt-4">
                <app-personal-details-tab [candidateForm]="candidateForm"></app-personal-details-tab>
            </div>
        </mat-tab>
        <mat-tab label="Professional Information">
            <div class="pt-4">
                <app-professional-details-tab [candidateForm]="candidateForm"></app-professional-details-tab>
            </div>
        </mat-tab>
        <mat-tab label="Resume">
            <div class="pt-4">
                <app-resume-details-tab [selectedResume]="selectedResume()" (selectedResumeChange)="selectedResume.set($event)"></app-resume-details-tab>
            </div>
        </mat-tab>
    </mat-tab-group>

    <div class="hurecom-dialog-footer flex items-center justify-end gap-2 mt-4">
        <button mat-stroked-button type="button" (click)="closeDialog()">Cancel</button>
        <button mat-flat-button color="primary" type="button" (click)="saveCandidate()">Save Candidate</button>
    </div>
</form>
