<div class="hr-modal-card">

    <div class="flex items-center justify-between mb-3">
        <span class="text-[15px] font-semibold">
            Resume
        </span>

        @if (!selectedResume()) {
        <button pButton type="button" label="Upload" icon="pi pi-upload" size="small"
            (click)="fileInput.click()">
        </button>
        }@else{
        <div class="flex items-center gap-2">

            <p-button icon="pi pi-sparkles" severity="primary" size="small">
            </p-button>

            <p-button icon="pi pi-eye" severity="secondary" size="small">
            </p-button>

            <p-button icon="pi pi-refresh" severity="secondary" size="small" (onClick)="fileInput.click()">
            </p-button>

            <p-button icon="pi pi-trash" severity="danger" [text]="true" size="small"
                (onClick)="deleteResume(fileInput)">
            </p-button>

        </div>
        }
    </div>

    <input #fileInput type="file" hidden accept=".pdf,.doc,.docx" (change)="onResumeSelected($event)">

    @if (selectedResume()) {

    <div class="resume-card gap-2">

        <div class="flex items-center gap-3">

            <i class="pi pi-file-pdf resume-icon"></i>

            <div class="flex flex-col">

                <span class="font-medium">
                    {{ selectedResume()!.name }}
                </span>

                <small class="text-color-secondary">
                    {{ formatFileSize(selectedResume()!.size) }}
                </small>

            </div>

        </div>
    </div>

    } @else {

    <div class="resume-card gap-2">

        <div class="flex items-center gap-3">

            <i class="pi pi-file text-2xl"></i>

            <div class="flex flex-col">

                <span class="font-medium">
                    Upload Resume
                </span>

                <small class="text-color-secondary">
                    Upload PDF, DOC or DOCX (Max 5 MB)
                </small>

            </div>

        </div>
    </div>
    }

</div>
