<div class="hr-modal-card">

    <div class="flex items-center justify-between mb-3">
        <span class="text-[15px] font-semibold">
            Resume
        </span>

        @if (!selectedResume()) {
        <button mat-stroked-button type="button" (click)="fileInput.click()">
            <mat-icon>upload</mat-icon>
            Upload
        </button>
        }@else{
        <div class="flex items-center gap-2">

            <button mat-icon-button color="primary" aria-label="Parse resume"><mat-icon>auto_awesome</mat-icon></button>

            <button mat-icon-button aria-label="Preview resume"><mat-icon>visibility</mat-icon></button>

            <button mat-icon-button aria-label="Replace resume" (click)="fileInput.click()"><mat-icon>refresh</mat-icon></button>

            <button mat-icon-button color="warn" aria-label="Delete resume" (click)="deleteResume(fileInput)"><mat-icon>delete</mat-icon></button>

        </div>
        }
    </div>

    <input #fileInput type="file" hidden accept=".pdf,.doc,.docx" (change)="onResumeSelected($event)">

    @if (selectedResume()) {

    <div class="resume-card gap-2">

        <div class="flex items-center gap-3">

            <mat-icon class="resume-icon">picture_as_pdf</mat-icon>

            <div class="flex flex-col">

                <span class="font-medium">
                    {{ selectedResume()!.name }}
                </span>

                <small class="text-color-secondary">
                    {{ formatFileSize(selectedResume()!.size) }}
                </small>

            </div>

        </div>
    </div>

    } @else {

    <div class="resume-card gap-2">

        <div class="flex items-center gap-3">

            <mat-icon class="text-2xl">description</mat-icon>

            <div class="flex flex-col">

                <span class="font-medium">
                    Upload Resume
                </span>

                <small class="text-color-secondary">
                    Upload PDF, DOC or DOCX (Max 5 MB)
                </small>

            </div>

        </div>
    </div>
    }

</div>
