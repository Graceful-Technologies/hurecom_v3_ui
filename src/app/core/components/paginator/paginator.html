<div class="flex items-center justify-end gap-3 mt-4">

    <!-- Left -->
    <div class="flex items-center gap-3 text-sm">

        <span style="color: #334155;">Items per page:</span>

        <mat-form-field appearance="outline" class="page-select-field">
            <mat-select [value]="rows()" (selectionChange)="onRowsChange($event.value)">
                @for (option of rowsOptions(); track option) {
                    <mat-option [value]="option">{{ option }}</mat-option>
                }
            </mat-select>
        </mat-form-field>

        <span style="color: #334155;">
            {{ firstRecord() }} - {{ lastRecord() }} of {{ totalRecords() }}
        </span>

    </div>

    <!-- Right -->
    <div class="flex items-center gap-2">

        <button mat-icon-button class="hr-page-btn" [disabled]="!hasPrev()" (click)="prev()" aria-label="Previous page">
            <mat-icon>chevron_left</mat-icon>
        </button>

        <button mat-icon-button class="hr-page-btn" [disabled]="!hasNext()" (click)="next()" aria-label="Next page">
            <mat-icon>chevron_right</mat-icon>
        </button>

    </div>

</div>
